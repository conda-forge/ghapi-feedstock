schema_version: 1

context:
  name: ghapi
  version: "2.0.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ghapi-${{ version }}.tar.gz
  sha256: 88cae2b02e6a493a3bd4370ea519be5c30c23bbc5818f010788750757ff9b660

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - ghapi=ghapi.cli:ghapi
      - ghpath=ghapi.cli:ghpath
      - ghraw=ghapi.cli:ghraw
      - completion-ghapi=ghapi.cli:completion_ghapi
      - gh-create-workflow=ghapi.actions:gh_create_workflow

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=64
  run:
    - python >=${{ python_min }}
    - fastcore >=1.14.5
    - fastspec >=0.1.0
    - pip

tests:
  - python:
      imports:
        - ghapi
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - ghapi --help
      - ghpath --help
      - ghraw --help
      - completion-ghapi --help
      - gh-create-workflow --help

about:
  summary: A python client for the GitHub API
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/fastai/ghapi/

extra:
  recipe-maintainers:
    - jtpio
    - thewchan
